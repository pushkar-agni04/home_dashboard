<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0d1117;--bg2:#161d2b;--panel:rgba(255,255,255,.035);--panel-b:rgba(255,255,255,.08);
  --text:#f2f4f8;--sub:#8d96ab;--accent:#5b9dff;--accent2:#3ddab4;
  --fs-clock:clamp(2.6rem,6.5vw,4.8rem);--fs-date:clamp(1rem,2vw,1.5rem);
  --fs-temp:clamp(1.5rem,3vw,2.3rem);--fs-wxd:clamp(.85rem,1.6vw,1.15rem);
  --fs-h:clamp(.7rem,1.1vw,.9rem);--radius:20px
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);overflow:hidden;
  background:radial-gradient(circle at 15% 10%,#1a2436,var(--bg1) 55%),linear-gradient(160deg,var(--bg2),var(--bg1))}
.dash{height:100vh;display:flex;flex-direction:column;padding:3vh 3vw;gap:2vh}
.card{background:var(--panel);border:1px solid var(--panel-b);border-radius:var(--radius);backdrop-filter:blur(6px)}
.header{display:flex;gap:2vw;align-items:stretch;flex-shrink:0}
.clock-card{flex:1;padding:2.2vh 2.2vw;display:flex;flex-direction:column;justify-content:center}
.clock-time{font-size:var(--fs-clock);font-weight:200;letter-spacing:-2px;line-height:1;background:linear-gradient(90deg,#fff,#c9d6f0);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock-time span{font-size:calc(var(--fs-clock)*.32);font-weight:400;color:var(--sub);-webkit-text-fill-color:var(--sub)}
.clock-date{font-size:var(--fs-date);color:var(--sub);margin-top:1vh;font-weight:400}
.wx-card{flex:1.3;padding:2.2vh 2.2vw;display:flex;flex-direction:column;justify-content:center;gap:1.2vh}
.wx-row1{display:flex;align-items:center;gap:1.2vw}
.wx-icon{font-size:clamp(2rem,4vw,3.2rem);line-height:1;flex-shrink:0}
.wx-main{min-width:0}
.wx-temp{font-size:var(--fs-temp);font-weight:300}
.wx-desc{font-size:var(--fs-wxd);color:var(--sub)}
.wx-city{font-size:calc(var(--fs-wxd)*.72);color:var(--sub);opacity:.8}
.wx-mini{display:none;flex-direction:column;gap:6px;margin-left:auto;flex-shrink:0}
.wx-badge{font-size:calc(var(--fs-wxd)*.68);padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:5px;white-space:nowrap}
.wx-badge b{color:var(--text);font-weight:700}
.wx-hourly{display:none;gap:1.6vw;overflow-x:auto}
.wx-hour{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:calc(var(--fs-wxd)*.6);color:var(--sub);min-width:36px}
.wx-hour .hi{font-size:1.05rem}
.wx-hour .ht{font-size:calc(var(--fs-wxd)*.7);color:var(--text);font-weight:600}
.wx-form{display:flex;gap:6px}
.wx-form input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:8px;padding:.6vh 1vw;color:var(--text);font-size:calc(var(--fs-wxd)*.68)}
.wx-form button{background:var(--accent);border:none;border-radius:8px;color:#fff;padding:.6vh 1.4vw;cursor:pointer;font-size:calc(var(--fs-wxd)*.68);font-weight:600}
.wx-err{font-size:calc(var(--fs-wxd)*.58);color:#ffb454}
.wx-manual{display:none;gap:6px;flex-wrap:wrap}
.wx-manual select,.wx-manual input{background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:8px;padding:5px 7px;color:var(--text);font-size:.7rem}
.wx-manual input{width:60px}
.wx-manual button{background:rgba(255,255,255,.08);border:1px solid var(--panel-b);border-radius:8px;color:var(--text);padding:5px 9px;cursor:pointer;font-size:.7rem}

.week-cal{flex:1;display:flex;flex-direction:column;padding:2vh 2vw;min-height:0}
.cal-head{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;margin-bottom:1.6vh}
.cal-title{font-size:clamp(1rem,1.9vw,1.5rem);font-weight:600}
.cal-nav{display:flex;gap:8px;align-items:center}
.nav-btn{background:rgba(255,255,255,.06);border:1px solid var(--panel-b);color:var(--text);width:clamp(30px,3.5vw,42px);height:clamp(30px,3.5vw,42px);border-radius:10px;cursor:pointer;font-size:1rem}
.nav-btn:hover{border-color:var(--accent)}
.month-btn{background:rgba(255,255,255,.06);border:1px solid var(--panel-b);color:var(--text);border-radius:10px;cursor:pointer;font-size:calc(var(--fs-h)*1.05);padding:0 14px;height:clamp(30px,3.5vw,42px);font-weight:600}
.month-btn:hover{border-color:var(--accent)}
.week-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:1vw;min-height:0}
.week-day{background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:14px;padding:1.2vh 1vw;
  display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:.15s;min-height:0}
.week-day:hover{border-color:var(--accent);background:rgba(91,157,255,.08)}
.week-day.today{border-color:var(--accent);background:rgba(91,157,255,.14)}
.week-day-head{text-align:center;margin-bottom:1vh;flex-shrink:0}
.week-day-name{font-size:var(--fs-h);color:var(--sub);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.week-day-num{font-size:clamp(1.3rem,2.8vw,2rem);font-weight:300;margin-top:2px}
.week-day.today .week-day-num{color:var(--accent);font-weight:600}
.week-events{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.week-ev{font-size:clamp(.62rem,1.05vw,.82rem);padding:6px 8px;border-radius:8px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.week-ev .t{opacity:.85;font-weight:400;margin-right:3px}
.week-empty{font-size:calc(var(--fs-h)*.95);color:var(--sub);text-align:center;margin-top:1vh}

.month-overlay{display:none;position:fixed;inset:0;background:var(--bg1);z-index:900;padding:3vh 3vw;flex-direction:column}
.month-overlay.active{display:flex}
.grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:.6vw;min-height:0}
.dh{text-align:center;font-size:var(--fs-h);font-weight:700;color:var(--sub);padding:4px 0;text-transform:uppercase;letter-spacing:.5px}
.day{background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:12px;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;padding:.6vh .6vw;overflow:hidden;min-height:0}
.day:hover{border-color:var(--accent);background:rgba(91,157,255,.08)}
.day.other{opacity:.25}
.day.today{border-color:var(--accent);background:rgba(91,157,255,.14)}
.day-num{font-size:clamp(.85rem,1.5vw,1.3rem);margin-bottom:2px;flex-shrink:0;font-weight:500}
.day.today .day-num{color:var(--accent)}
.ev-line{font-size:clamp(.6rem,1.05vw,.85rem);line-height:1.35;padding:1px 5px;border-radius:5px;color:#fff;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;flex-shrink:0;font-weight:500}
.ev-time{opacity:.85;margin-right:3px}
.ev-more{font-size:.6rem;color:var(--sub)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:3vh 3vw}
.modal.active{display:flex}
.modal-box{background:#161d2b;border:1px solid var(--panel-b);border-radius:20px;padding:clamp(20px,3vw,32px);width:100%;max-width:460px;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--sub);font-size:1.6rem;cursor:pointer}
.modal-title{font-size:clamp(1.1rem,2vw,1.4rem);font-weight:600;margin-bottom:16px;padding-right:24px}
.ev-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:8px}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.ev-body{flex:1;min-width:0}
.ev-name{font-size:1rem;font-weight:500}
.ev-meta{font-size:.8rem;color:var(--sub)}
.empty{font-size:.95rem;color:var(--sub);margin-bottom:12px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.form-row label{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--sub);letter-spacing:.5px}
.form-row input{background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:10px;padding:12px;color:var(--text);font-size:1rem}
.member-chips{display:flex;flex-wrap:wrap;gap:8px}
.member-chip{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-radius:16px;background:rgba(255,255,255,.06);
  border:1px solid var(--panel-b);font-size:.9rem;cursor:pointer}
.member-chip.selected{border-color:var(--accent);background:rgba(91,157,255,.18)}
.member-chip .dot{width:10px;height:10px}
.member-chip .del{margin-left:2px;color:var(--sub);font-size:1.05rem;padding:0 3px;line-height:1}
.member-chip .del:hover{color:#ef5350}
.chip-add{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--panel-b);color:var(--text);cursor:pointer;font-size:1.15rem}
.new-member-row{display:none;gap:8px;margin-top:10px}
.new-member-row input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--panel-b);border-radius:10px;padding:10px 12px;color:var(--text);font-size:.9rem}
.new-member-row button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 16px;cursor:pointer;font-size:.9rem;font-weight:600}
.add-ev-btn{width:100%;margin-top:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08111f;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.fam-del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1.1rem;padding:0 3px}
.fam-del:hover{color:#ef5350}
@media (max-width:820px),(orientation:portrait){
  body{overflow:auto}
  .dash{height:auto;min-height:100vh}
  .header{flex-wrap:wrap}
  .clock-card,.wx-card{min-width:260px}
  .week-grid{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));grid-auto-rows:150px}
  .month-overlay{overflow-y:auto}
  .grid{grid-template-rows:auto repeat(6,minmax(50px,1fr))}
}
</style>
</head>
<body>
<div class="dash">
  <div class="header">
    <div class="card clock-card">
      <div class="clock-time" id="clock">--:-- <span id="ampm"></span></div>
      <div class="clock-date" id="date">--</div>
    </div>
    <div class="card wx-card">
      <div class="wx-row1"><span class="wx-icon" id="wxIcon">🌤️</span>
        <div class="wx-main"><div class="wx-temp" id="wxTemp">--°</div><div class="wx-desc" id="wxDesc">Enter your city</div><div class="wx-city" id="wxCity"></div></div>
        <div class="wx-mini" id="wxMini">
          <div class="wx-badge">💧<b id="wxPrecip">--</b></div>
          <div class="wx-badge">🍃<b id="wxAqi">--</b></div>
        </div>
      </div>
      <div class="wx-hourly" id="wxHourly"></div>
      <div class="wx-form"><input id="cityInput" placeholder="City name"><button onclick="fetchWeather()">Go</button></div>
      <div class="wx-err" id="wxErr"></div>
      <div class="wx-manual" id="wxManual">
        <select id="manCond">
          <option value="☀️|Clear">☀️ Clear</option>
          <option value="⛅|Partly cloudy">⛅ Partly cloudy</option>
          <option value="☁️|Overcast">☁️ Overcast</option>
          <option value="🌦️|Light rain">🌦️ Light rain</option>
          <option value="🌧️|Rain">🌧️ Rain</option>
          <option value="⛈️|Storm">⛈️ Storm</option>
          <option value="❄️|Snow">❄️ Snow</option>
          <option value="🌫️|Fog">🌫️ Fog</option>
        </select>
        <input type="number" id="manTemp" placeholder="Temp °">
        <button onclick="setManualWeather()">Set</button>
      </div>
    </div>
  </div>

  <div class="card week-cal">
    <div class="cal-head">
      <div class="cal-title" id="weekTitle">--</div>
      <div class="cal-nav">
        <button class="nav-btn" onclick="prevWeek()">←</button>
        <button class="nav-btn" onclick="goTodayWeek()">•</button>
        <button class="nav-btn" onclick="nextWeek()">→</button>
        <button class="month-btn" onclick="openMonth()">📅 Month view</button>
      </div>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</div>

<div class="month-overlay" id="monthOverlay">
  <div class="cal-head">
    <div class="cal-title" id="monthYear">--</div>
    <div class="cal-nav">
      <button class="nav-btn" onclick="prevMonth()">←</button>
      <button class="nav-btn" onclick="goTodayMonth()">•</button>
      <button class="nav-btn" onclick="nextMonth()">→</button>
      <button class="month-btn" onclick="closeMonth()">✕ Back to dashboard</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalDate">--</div>
    <div id="evList"></div>
    <div class="form-row"><label>Event name</label><input id="evName" placeholder="e.g. Dinner"></div>
    <div class="form-row"><label>Time (optional)</label><input type="time" id="evTime"></div>
    <div class="form-row"><label>Added by</label>
      <div class="member-chips" id="memberChips"></div>
      <div class="new-member-row" id="newMemberRow">
        <input id="newMemberName" placeholder="Member name">
        <button onclick="confirmNewMember()">Add</button>
      </div>
    </div>
    <button class="add-ev-btn" onclick="addEvent()">Add event</button>
  </div>
</div>

<script>
const COLORS=['#5b9dff','#ef5350','#3ddab4','#ab47bc','#ffa726','#26a69a'];
let cur=new Date(), weekStart=startOfDay(new Date()), selDate=null, selMemberId=null;
let data={events:{},members:[]};

function startOfDay(d){const n=new Date(d);n.setHours(0,0,0,0);return n;}
function keyOf(d){return d.toISOString().split('T')[0];}

function load(){
  const s=localStorage.getItem('familyCalendarData');
  if(s){data=JSON.parse(s);}
  else{data.members=[{id:Date.now(),name:'You',color:COLORS[0]}];save();}
}
function save(){localStorage.setItem('familyCalendarData',JSON.stringify(data));}

function tick(){
  const n=new Date();
  let h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');
  const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
  document.getElementById('clock').innerHTML=`${h}:${m} <span id="ampm">${ap}</span>`;
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

const WX={0:['☀️','Clear sky'],1:['🌤️','Mainly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],
  45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Dense drizzle'],
  56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌧️','Slight rain'],63:['🌧️','Rain'],
  65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['❄️','Slight snow'],
  73:['❄️','Snow'],75:['❄️','Heavy snow'],77:['❄️','Snow grains'],80:['🌦️','Rain showers'],
  81:['🌧️','Rain showers'],82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['🌨️','Snow showers'],
  95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm hail'],99:['⛈️','Thunderstorm hail']};

function aqiLabel(v){
  if(v<=50)return v+' Good'; if(v<=100)return v+' Moderate'; if(v<=150)return v+' Sensitive';
  if(v<=200)return v+' Unhealthy'; if(v<=300)return v+' V.Unhealthy'; return v+' Hazardous';
}

async function fetchWeather(){
  const city=document.getElementById('cityInput').value.trim();
  const err=document.getElementById('wxErr');
  err.textContent='';
  document.getElementById('wxManual').style.display='none';
  document.getElementById('wxHourly').style.display='none';
  document.getElementById('wxMini').style.display='none';
  if(!city){err.textContent='Enter a city';return;}
  document.getElementById('wxDesc').textContent='Loading...';
  try{
    const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`).then(r=>r.json());
    if(!geo.results||!geo.results.length){err.textContent='City not found';document.getElementById('wxDesc').textContent='Enter city';return;}
    const loc=geo.results[0];
    const [w,aq]=await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code,precipitation&hourly=temperature_2m,weather_code&forecast_days=1&timezone=auto`).then(r=>r.json()),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${loc.latitude}&longitude=${loc.longitude}&current=us_aqi`).then(r=>r.json()).catch(()=>null)
    ]);
    const code=w.current.weather_code;
    const [icon,desc]=WX[code]||['🌡️','Unknown'];
    document.getElementById('wxIcon').textContent=icon;
    document.getElementById('wxTemp').textContent=Math.round(w.current.temperature_2m)+'°';
    document.getElementById('wxDesc').textContent=desc;
    document.getElementById('wxCity').textContent=`${loc.name}, ${loc.country}`;
    document.getElementById('wxPrecip').textContent=(w.current.precipitation??0)+'mm';
    document.getElementById('wxAqi').textContent=(aq&&aq.current&&aq.current.us_aqi!=null)?aqiLabel(Math.round(aq.current.us_aqi)):'N/A';
    document.getElementById('wxMini').style.display='flex';
    const nowIso=w.current.time;
    let idx=w.hourly.time.findIndex(t=>t>=nowIso); if(idx<0)idx=0;
    const hrs=document.getElementById('wxHourly');
    hrs.innerHTML=w.hourly.time.slice(idx,idx+6).map((t,i)=>{
      const hc=w.hourly.weather_code[idx+i]; const [hi]=WX[hc]||['🌡️'];
      const temp=Math.round(w.hourly.temperature_2m[idx+i]);
      const hr=new Date(t).toLocaleTimeString('en-US',{hour:'numeric'});
      return `<div class="wx-hour"><div>${hr}</div><div class="hi">${hi}</div><div class="ht">${temp}°</div></div>`;
    }).join('');
    hrs.style.display='flex';
  }catch(e){
    document.getElementById('wxDesc').textContent='Enter city';
    err.textContent='Live fetch blocked here. Set manually, or check once hosted (e.g. GitHub Pages):';
    document.getElementById('wxManual').style.display='flex';
  }
}
function setManualWeather(){
  const [icon,desc]=document.getElementById('manCond').value.split('|');
  const t=document.getElementById('manTemp').value;
  document.getElementById('wxIcon').textContent=icon;
  document.getElementById('wxDesc').textContent=desc;
  document.getElementById('wxTemp').textContent=t?t+'°':'--°';
  document.getElementById('wxCity').textContent=document.getElementById('cityInput').value.trim();
}

function renderMemberChips(){
  const wrap=document.getElementById('memberChips');
  wrap.innerHTML=data.members.map(m=>`
    <div class="member-chip ${m.id===selMemberId?'selected':''}" onclick="selectMember(${m.id})">
      <div class="dot" style="background:${m.color}"></div><span>${m.name}</span>
      <span class="del" onclick="event.stopPropagation();delMember(${m.id})">×</span>
    </div>`).join('') + `<button class="chip-add" onclick="toggleNewMember()">+</button>`;
}
function selectMember(id){selMemberId=id;renderMemberChips();}
function delMember(id){
  data.members=data.members.filter(m=>m.id!==id);
  if(selMemberId===id)selMemberId=null;
  save();renderMemberChips();renderWeek();if(monthOpen)renderMonth();
}
function toggleNewMember(){
  const row=document.getElementById('newMemberRow');
  row.style.display=row.style.display==='flex'?'none':'flex';
}
function confirmNewMember(){
  const inp=document.getElementById('newMemberName');
  const name=inp.value.trim(); if(!name)return;
  const m={id:Date.now(),name,color:COLORS[data.members.length%COLORS.length]};
  data.members.push(m); selMemberId=m.id;
  save();renderMemberChips(); inp.value='';
  document.getElementById('newMemberRow').style.display='none';
}

function renderWeek(){
  const opts={month:'short',day:'numeric'};
  const endD=new Date(weekStart); endD.setDate(endD.getDate()+6);
  document.getElementById('weekTitle').textContent=`${weekStart.toLocaleDateString('en-US',opts)} – ${endD.toLocaleDateString('en-US',opts)}`;
  const grid=document.getElementById('weekGrid');
  grid.innerHTML='';
  const todayStr=new Date().toDateString();
  for(let i=0;i<7;i++){
    const d=new Date(weekStart); d.setDate(d.getDate()+i);
    const key=keyOf(d);
    const el=document.createElement('div');
    el.className='week-day'+(d.toDateString()===todayStr?' today':'');
    const evs=(data.events[key]||[]).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const evHtml=evs.length?evs.map(e=>{
      const mem=data.members.find(x=>x.id==e.memberId);
      const t=e.time?`<span class="t">${e.time}</span>`:'';
      return `<div class="week-ev" style="background:${mem?mem.color:'#666'}">${t}${e.name}</div>`;
    }).join(''):'<div class="week-empty">No events</div>';
    el.innerHTML=`<div class="week-day-head"><div class="week-day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
      <div class="week-day-num">${d.getDate()}</div></div><div class="week-events">${evHtml}</div>`;
    el.onclick=()=>openModal(key);
    grid.appendChild(el);
  }
}
function prevWeek(){weekStart.setDate(weekStart.getDate()-7);renderWeek();}
function nextWeek(){weekStart.setDate(weekStart.getDate()+7);renderWeek();}
function goTodayWeek(){weekStart=startOfDay(new Date());renderWeek();}

let monthOpen=false;
function openMonth(){monthOpen=true;cur=new Date();document.getElementById('monthOverlay').classList.add('active');renderMonth();}
function closeMonth(){monthOpen=false;document.getElementById('monthOverlay').classList.remove('active');}
function renderMonth(){
  const y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('monthYear').textContent=cur.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first=new Date(y,m,1);
  const start=new Date(first);start.setDate(start.getDate()-first.getDay());
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{const h=document.createElement('div');h.className='dh';h.textContent=d;grid.appendChild(h);});
  const cell=new Date(start);
  const todayStr=new Date().toDateString();
  for(let i=0;i<42;i++){
    const el=document.createElement('div');
    el.className='day';
    if(cell.getMonth()!==m)el.classList.add('other');
    if(cell.toDateString()===todayStr)el.classList.add('today');
    const key=keyOf(cell);
    const evs=(data.events[key]||[]).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const shown=evs.slice(0,2).map(e=>{
      const mem=data.members.find(x=>x.id==e.memberId);
      const t=e.time?`<span class="ev-time">${e.time}</span>`:'';
      return `<div class="ev-line" style="background:${mem?mem.color:'#666'}">${t}${e.name}</div>`;
    }).join('');
    const more=evs.length>2?`<div class="ev-more">+${evs.length-2} more</div>`:'';
    el.innerHTML=`<div class="day-num">${cell.getDate()}</div>${shown}${more}`;
    el.onclick=()=>openModal(key);
    grid.appendChild(el);
    cell.setDate(cell.getDate()+1);
  }
}
function prevMonth(){cur.setMonth(cur.getMonth()-1);renderMonth();}
function nextMonth(){cur.setMonth(cur.getMonth()+1);renderMonth();}
function goTodayMonth(){cur=new Date();renderMonth();}

function openModal(key){
  selDate=key;
  selMemberId=data.members.length?data.members[0].id:null;
  const d=new Date(key+'T00:00:00');
  document.getElementById('modalDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const evs=data.events[key]||[];
  const list=document.getElementById('evList');
  if(!evs.length){list.innerHTML='<div class="empty">No events yet</div>';}
  else{
    list.innerHTML=evs.map((e,i)=>{
      const mem=data.members.find(x=>x.id==e.memberId);
      return `<div class="ev-item"><div class="dot" style="background:${mem?mem.color:'#888'}"></div>
        <div class="ev-body"><div class="ev-name">${e.name}</div>
        <div class="ev-meta">${e.time||'No time'} · ${mem?mem.name:'Unknown'}</div></div>
        <button class="fam-del" onclick="delEvent('${key}',${i})">×</button></div>`;
    }).join('');
  }
  document.getElementById('evName').value='';
  document.getElementById('evTime').value='';
  document.getElementById('newMemberRow').style.display='none';
  renderMemberChips();
  document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active');selDate=null;}
function addEvent(){
  if(!selDate)return;
  const name=document.getElementById('evName').value.trim();
  const time=document.getElementById('evTime').value;
  if(!name){alert('Enter an event name');return;}
  if(!selMemberId){alert('Pick a family member');return;}
  if(!data.events[selDate])data.events[selDate]=[];
  data.events[selDate].push({id:Date.now(),name,time,memberId:selMemberId});
  save();renderWeek();if(monthOpen)renderMonth();openModal(selDate);
}
function delEvent(key,idx){
  data.events[key].splice(idx,1);
  if(!data.events[key].length)delete data.events[key];
  save();renderWeek();if(monthOpen)renderMonth();openModal(key);
}

load();tick();renderWeek();setInterval(tick,30000);
document.getElementById('evName').addEventListener('keypress',e=>{if(e.key==='Enter')addEvent();});
document.getElementById('cityInput').addEventListener('keypress',e=>{if(e.key==='Enter')fetchWeather();});
</script>
</body>
